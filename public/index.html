<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi-provider-trace</title>
<script>
(function(){try{var p=localStorage.getItem("pi-trace-theme")||"system";var t=p==="light"||p==="dark"?p:(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();
</script>
<link rel="stylesheet" href="/css/tokens.css" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/forms.css" />
<link rel="stylesheet" href="/css/code-highlight.css" />
<link rel="stylesheet" href="/css/layout.css" />
<link rel="stylesheet" href="/css/chrome.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101010'/%3E%3Ccircle cx='10' cy='16' r='3' fill='%23ee6018'/%3E%3Cpath stroke='%23eeeeee' stroke-width='2' fill='none' d='M14 16h10M22 12v8'/%3E%3C/svg%3E" />
</head>
<body>
<header>
  <h1 data-i18n="title">pi-provider-trace</h1>
  <span id="conn" class="pill">—</span>
  <span id="traceState" class="pill">—</span>
  <span id="stats" class="stat"></span>
  <input class="search grow" id="search" data-i18n-placeholder="filterPlaceholder" />
  <select class="theme-select trace-ui-select" id="theme" aria-label="theme"></select>
  <select class="lang-select trace-ui-select" id="lang" aria-label="lang">
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
  <button type="button" class="btn" id="btnPause" data-i18n="pause">暂停</button>
  <button type="button" class="btn" id="btnClear" data-i18n="clear">清空</button>
</header>
<div class="workspace">
  <div class="col">
    <div class="col-head" data-i18n="sessions">Pi 会话</div>
    <div id="sessionList" class="scroll"></div>
  </div>
  <div class="col">
    <div class="col-head" data-i18n="exchanges">HTTP 交换</div>
    <div class="col-toolbar"><label><input type="checkbox" class="trace-ui-check" id="autoSelect" checked /> <span data-i18n="autoFollow">自动跟随</span></label></div>
    <div id="exchangeList" class="scroll"></div>
  </div>
  <div id="main" class="col trace-stage">
    <div class="trace-frame">
    <div class="window-chrome" aria-hidden="true">
      <div class="window-dots"><span class="dot-close"></span><span class="dot-min"></span><span class="dot-max"></span></div>
      <div class="window-title"><strong>TRACE</strong> · live wire capture</div>
    </div>
    <div class="tabs">
      <div class="tab" data-tab="stream" data-i18n="tabStream">流式 SSE</div>
      <div class="tab" data-tab="req-headers" data-i18n="tabReqHeaders">请求头</div>
      <div class="tab" data-tab="request-body" data-i18n="tabRequestBody">请求体</div>
      <div class="tab" data-tab="response" data-i18n="tabResponse">响应</div>
      <div class="tab" data-tab="raw" data-i18n="tabRaw">原始</div>
      <div class="tab active" data-tab="overview" data-i18n="tabOverview">Trace 总览</div>
      <div class="tab" data-tab="usage" data-i18n="tabUsage">用量</div>
      <div class="tab" data-tab="timeline" data-i18n="tabTimeline">时间线</div>
    </div>
    <div id="panel" class="scroll"></div>
    </div>
  </div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Pi Provider Trace</title>
  <script>
    (() => {
      try {
        const themePreference = localStorage.getItem("pi-trace-theme") || "system";
        const theme = themePreference === "system"
          ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : themePreference;
        const savedLocale = localStorage.getItem("pi-trace-locale");
        const locale = savedLocale === "zh" || savedLocale === "en"
          ? savedLocale
          : (/^zh\b/i.test(navigator.language || "") ? "zh" : "en");
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.locale = locale;
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
      } catch {}
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d1d1f'/%3E%3Cpath d='M7 10h8m-8 6h18M7 22h12' stroke='%230a84ff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='10' r='3' fill='none' stroke='%23f5f5f7' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app" class="app-shell" data-surface="workbench" data-mobile-pane="sessions" aria-busy="true">
    <header class="topbar">
      <div class="brand" aria-label="Pi Provider Trace">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 7h8M3 12h18M3 17h12"/><circle cx="18" cy="7" r="3"/></svg>
        </span>
        <span class="brand-name">Session Trace</span>
        <span class="brand-context">PI</span>
      </div>

      <label class="command-search" for="globalSearch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="globalSearch" type="search" autocomplete="off" spellcheck="false" placeholder="搜索会话、模型、请求或输出">
        <kbd>/</kbd>
      </label>

      <div class="topbar-actions">
        <button id="overviewButton" class="text-button surface-toggle" type="button" aria-pressed="false" data-text="overview">总览</button>
        <button id="toggleSessionsButton" class="icon-button layout-toggle" type="button" aria-pressed="true" data-label="showSessionsPane" title="显示或隐藏会话栏">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <button id="toggleRequestsButton" class="icon-button layout-toggle" type="button" aria-pressed="true" data-label="showRequestsPane" title="显示或隐藏请求栏">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        </button>
        <span class="topbar-divider" aria-hidden="true"></span>
        <button id="connectionState" class="connection-state" type="button" data-state="connecting" data-label="connectionStatus">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connectionLabel">连接中</span>
        </button>
        <button id="refreshButton" class="icon-button" type="button" data-label="refresh" title="刷新">
          <svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8.3A7 7 0 0 1 18.8 7M17.9 15.7A7 7 0 0 1 5.2 17"/></svg>
        </button>
        <span class="topbar-divider" aria-hidden="true"></span>
        <button id="shortcutsButton" class="icon-button" type="button" data-label="shortcuts" title="快捷键">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
        </button>
        <button id="themeButton" class="icon-button theme-button" type="button" data-label="toggleTheme" title="切换主题">
          <svg class="theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="theme-moon" viewBox="0 0 24 24"><path d="M20 15.3A8 8 0 0 1 8.7 4 8.2 8.2 0 1 0 20 15.3Z"/></svg>
        </button>
        <button id="localeButton" class="text-button locale-button" type="button" data-label="toggleLocale">中</button>
      </div>
    </header>

    <section id="overviewSurface" class="overview-surface" aria-labelledby="overviewTitle">
      <header class="overview-head">
        <div class="heading-copy">
          <h1 id="overviewTitle" tabindex="-1" data-text="overview">总览</h1>
        </div>
        <div id="overviewWindow" class="window-toggle" role="group" data-label="windowLabel">
          <button type="button" data-window="24h" aria-pressed="false" data-text="window24h">24 小时</button>
          <button type="button" data-window="7d" aria-pressed="true" data-text="window7d">7 天</button>
          <button type="button" data-window="30d" aria-pressed="false" data-text="window30d">30 天</button>
          <button type="button" data-window="all" aria-pressed="false" data-text="windowAll">全部</button>
        </div>
        <button id="overviewClose" class="text-button" type="button" data-action="close-overview" data-text="backToWorkbench">返回工作台</button>
      </header>
      <div id="overviewBody" class="pane-scroll overview-body"></div>
    </section>

    <main class="workbench">
      <aside class="sessions-pane pane" data-label="sessions" aria-label="会话">
        <div class="pane-heading">
          <h1 data-text="sessions">会话</h1>
          <div class="pane-heading-actions">
            <span id="sessionCount" class="count-label">0</span>
            <button id="batchModeButton" class="compact-button" type="button" aria-pressed="false" data-text="batchManage">批量</button>
          </div>
        </div>
        <div id="sessionList" class="pane-scroll session-list"></div>
        <div id="sessionBatchActions" class="session-batch-actions" hidden>
          <button id="selectAllSessions" class="batch-select-all" type="button" aria-pressed="false">
            <span class="selection-box" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="m3.5 8 3 3 6-6"/></svg></span>
            <span id="selectAllSessionsLabel">全选可见</span>
          </button>
          <span id="batchSelectionLabel" class="batch-selection-label">已选 0 项</span>
          <div class="batch-action-buttons">
            <button id="batchExportSessions" class="quiet-action" type="button" data-text="export">导出</button>
            <button id="batchDeleteSessions" class="quiet-action danger" type="button" data-text="delete">删除</button>
          </div>
        </div>
      </aside>

      <div class="pane-resizer" data-resize-pane="sessions" role="separator" aria-orientation="vertical" data-label="resizeSessionsPane" tabindex="0"></div>

      <section class="requests-pane pane" data-label="requests" aria-label="模型请求">
        <div class="pane-heading request-heading">
          <button class="mobile-back" type="button" data-mobile-target="sessions" data-label="backToSessions">
            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="heading-copy">
            <h1 id="sessionTitle">模型请求</h1>
            <button id="sessionKeyLabel" class="identity-sub key-copy" type="button" data-copy="sessionKey" data-label="copySessionKey">—</button>
          </div>
          <div class="heading-actions">
            <button id="followButton" class="follow-button" type="button" aria-pressed="true">
              <span class="status-dot" aria-hidden="true"></span>
              <span data-text="follow">跟随</span>
            </button>
            <!-- Export and delete act on the named session, so they live beside its name. -->
            <div id="sessionActions" class="session-actions" hidden>
              <a id="exportSession" class="icon-button" href="#" target="_blank" rel="noopener" data-label="exportSession" title="导出">
                <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/></svg>
              </a>
              <button id="deleteSession" class="icon-button danger-button" type="button" data-label="deleteSession" title="删除">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l.8 12h9.4l.8-12"/><path d="M10 11v5M14 11v5"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="sessionSummary" class="session-summary" aria-label="会话摘要"></div>
        <div class="requests-toolbar">
          <div id="listModeToggle" class="list-mode-toggle" role="group" data-label="listModeLabel">
            <button type="button" data-list-mode="requests" aria-pressed="false" data-text="requests">请求</button>
            <button type="button" data-list-mode="turns" aria-pressed="true" data-text="turns">回合</button>
          </div>
          <div class="request-filters">
            <select id="providerFilter" data-label="filterProvider">
              <option value="">全部 Provider</option>
            </select>
            <select id="statusFilter" data-label="filterStatus">
              <option value="">全部状态</option>
              <option value="live">流式中</option>
              <option value="ok">成功</option>
              <option value="error">失败</option>
            </select>
          </div>
        </div>
        <div id="requestList" class="pane-scroll request-list"></div>
      </section>

      <div class="pane-resizer" data-resize-pane="requests" role="separator" aria-orientation="vertical" data-label="resizeRequestsPane" tabindex="0"></div>

      <section class="inspector-pane pane" data-label="evidenceEyebrow" aria-label="请求检查器">
        <div class="inspector-heading">
          <button class="mobile-back" type="button" data-mobile-target="requests" data-label="backToRequests">
            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div id="inspectorIdentity" class="inspector-identity">
            <h1 data-text="selectRequest">选择一次模型请求</h1>
          </div>
          <div id="inspectorMetrics" class="inspector-metrics"></div>
        </div>
        <div id="inspectorTabs" class="inspector-tabs" data-label="inspectorTabsLabel" role="tablist">
          <button type="button" id="tab-flow" data-tab="flow" role="tab" aria-selected="true" aria-controls="inspectorPanel" data-text="flow">联动</button>
          <button type="button" id="tab-payload" data-tab="payload" role="tab" aria-selected="false" aria-controls="inspectorPanel" tabindex="-1" data-text="payload">输入</button>
          <button type="button" id="tab-headers" data-tab="headers" role="tab" aria-selected="false" aria-controls="inspectorPanel" tabindex="-1" data-text="headers">请求头</button>
          <button type="button" id="tab-responseMeta" data-tab="responseMeta" role="tab" aria-selected="false" aria-controls="inspectorPanel" tabindex="-1" data-text="responseMeta">响应</button>
          <button type="button" id="tab-response" data-tab="response" role="tab" aria-selected="false" aria-controls="inspectorPanel" tabindex="-1" data-text="response">输出</button>
          <button type="button" id="tab-timeline" data-tab="timeline" role="tab" aria-selected="false" aria-controls="inspectorPanel" tabindex="-1" data-text="timeline">时间线</button>
          <button type="button" id="tab-raw" data-tab="raw" role="tab" aria-selected="false" aria-controls="inspectorPanel" tabindex="-1" data-text="raw">原始</button>
        </div>
        <div id="inspectorPanel" class="pane-scroll inspector-panel" role="tabpanel" aria-labelledby="tab-flow" tabindex="0"></div>
      </section>
    </main>
  </div>

  <dialog id="shortcutsDialog" class="shortcuts-dialog" aria-labelledby="shortcutsTitle">
    <div class="shortcuts-head">
      <h2 id="shortcutsTitle" data-text="shortcuts">快捷键</h2>
      <button class="text-button" type="button" data-action="close-shortcuts" data-text="close">关闭</button>
    </div>
    <dl class="shortcuts-list">
      <div><dt><kbd>/</kbd><kbd>⌘K</kbd></dt><dd data-text="shortcutSearch">聚焦搜索</dd></div>
      <div><dt><kbd>j</kbd><kbd>k</kbd><kbd>↓</kbd><kbd>↑</kbd></dt><dd data-text="shortcutNav">在当前列表中上下移动</dd></div>
      <div><dt><kbd>Enter</kbd></dt><dd data-text="shortcutOpen">打开聚焦的行</dd></div>
      <div><dt><kbd>Esc</kbd></dt><dd data-text="shortcutBack">返回上一栏</dd></div>
      <div><dt><kbd>o</kbd></dt><dd data-text="shortcutOverview">切换总览</dd></div>
      <div><dt><kbd>?</kbd></dt><dd data-text="shortcutHelp">显示快捷键</dd></div>
    </dl>
  </dialog>

  <p id="liveStatus" class="visually-hidden" role="status" aria-live="polite"></p>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
